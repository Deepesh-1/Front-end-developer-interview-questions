<!-- IntersectionObserver watches an element and tells you when that element enters or leaves the viewport. -->
<!DOCTYPE html>
<html>
<head>
  <title>Intersection Observer</title>
  <style>
    body {
      height: 2000px;
    }
    #box {
      margin-top: 1000px;
      padding: 50px;
      background: lightblue;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Scroll down</h1>
  <!-- This is the element we want to observe -->
  <div id="box">
    I'm being observed 👀
  </div>
  <script>
    // Get the element that we want to observe.
    const box = document.getElementById("box");

    // Create an IntersectionObserver.
    //
    // The callback function runs whenever
    // the visibility of the observed element changes.
    const observer = new IntersectionObserver((entries) => {

      // entries is an array containing information
      // about the elements being observed.
      const entry = entries[0];

      // isIntersecting tells us whether
      // the element is currently visible in the viewport.
      if (entry.isIntersecting) {
        console.log("Box is visible!");
      } else {
        console.log("Box is NOT visible!");
      }
    });

    // Start observing the box.
    observer.observe(box);
  </script>

</body>
</html>
